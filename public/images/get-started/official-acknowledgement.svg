<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none" width="100%" height="100%">
  <defs>
    <filter id="shadow-medal" x="-15%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    <linearGradient id="gold-gradient" x1="20" y1="12" x2="80" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="inner-gold" x1="26" y1="18" x2="74" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="ribbon-left" x1="30" y1="50" x2="45" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="ribbon-right" x1="55" y1="50" x2="70" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow-medal)">
    <!-- Blue Ribbons Behind Medal -->
    <!-- Left Ribbon -->
    <path d="M38 52 L32 98 L43 89 L50 98 L45 52 Z" fill="url(#ribbon-left)" />
    <!-- Right Ribbon -->
    <path d="M55 52 L50 98 L57 89 L68 98 L62 52 Z" fill="url(#ribbon-right)" />

    <!-- Gold Medal Circle -->
    <!-- Outer Medal Rim -->
    <circle cx="50" cy="42" r="32" fill="url(#gold-gradient)" stroke="#B45309" stroke-width="1.5" />
    
    <!-- Inner Rim -->
    <circle cx="50" cy="42" r="26" fill="url(#inner-gold)" stroke="#F59E0B" stroke-width="1.5" />

    <!-- 5-Point Embossed Star -->
    <path d="
      M 50 25
      L 53.8 35.8
      L 65.2 36.1
      L 56.1 43.1
      L 59.4 54.0
      L 50 47.5
      L 40.6 54.0
      L 43.9 43.1
      L 34.8 36.1
      L 46.2 35.8
      Z
    " fill="#FDE68A" stroke="#F59E0B" stroke-width="1" stroke-linejoin="round" />
  </g>
</svg>
