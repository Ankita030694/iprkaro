<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <filter id="shadow-form" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Document Window -->
  <g filter="url(#shadow-form)">
    <!-- Window Body -->
    <rect x="15" y="16" width="62" height="70" rx="8" fill="#F0F9FF" stroke="#475569" stroke-width="2" />
    
    <!-- Top Bar -->
    <path d="M15 24 C15 19.6 18.6 16 23 16 L69 16 C73.4 16 77 19.6 77 24 L77 30 L15 30 Z" fill="#334155" />
    <!-- Window Dots -->
    <circle cx="23" cy="23" r="2.2" fill="#EF4444" />
    <circle cx="29" cy="23" r="2.2" fill="#FBBF24" />
    <circle cx="35" cy="23" r="2.2" fill="#22C55E" />

    <!-- Checklist Rows -->
    <!-- Row 1 -->
    <rect x="22" y="37" width="10" height="10" rx="2" fill="#22C55E" />
    <path d="M24.5 42 L26.5 44 L29.5 39.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="40" width="30" height="4.5" rx="2" fill="#93C5FD" />

    <!-- Row 2 -->
    <rect x="22" y="52" width="10" height="10" rx="2" fill="#22C55E" />
    <path d="M24.5 57 L26.5 59 L29.5 54.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="55" width="24" height="4.5" rx="2" fill="#CBD5E1" />

    <!-- Row 3 -->
    <rect x="22" y="67" width="10" height="10" rx="2" fill="#38BDF8" />
    <path d="M24.5 72 L26.5 74 L29.5 69.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="70" width="20" height="4.5" rx="2" fill="#CBD5E1" />
  </g>

  <!-- Angled Stylus / Red Pencil on the Right -->
  <g transform="translate(68, 62) rotate(25)" filter="url(#shadow-form)">
    <!-- Eraser -->
    <rect x="-4" y="-32" width="8" height="6" rx="2" fill="#F43F5E" />
    <!-- Metal band -->
    <rect x="-4" y="-26" width="8" height="3" fill="#94A3B8" />
    <!-- Pencil body -->
    <rect x="-4" y="-23" width="8" height="23" fill="#DC2626" />
    <!-- Wood tip -->
    <polygon points="-4,0 4,0 0,8" fill="#FDE047" />
    <!-- Lead nib -->
    <polygon points="-1.5,5 1.5,5 0,8" fill="#1E293B" />
  </g>
</svg>
