<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <filter id="shadow-id" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- ID Card base -->
  <g filter="url(#shadow-id)">
    <rect x="14" y="24" width="70" height="52" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <rect x="17" y="27" width="64" height="46" rx="5" fill="#FFFFFF" />

    <!-- Avatar Left -->
    <!-- Head -->
    <circle cx="33" cy="43" r="7.5" fill="#38BDF8" />
    <!-- Torso / Shoulders -->
    <path d="M22 62 C22 53 26 52 33 52 C40 52 44 53 44 62 Z" fill="#38BDF8" />

    <!-- Details Right -->
    <rect x="50" y="38" width="24" height="5" rx="2.5" fill="#94A3B8" />
    <rect x="50" y="47" width="20" height="4" rx="2" fill="#CBD5E1" />
    <rect x="50" y="55" width="22" height="4" rx="2" fill="#CBD5E1" />
  </g>

  <!-- Green Verified Badge on Top Right -->
  <g filter="url(#shadow-id)">
    <circle cx="74" cy="24" r="11" fill="#22C55E" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- White checkmark -->
    <path d="M69 24 L72.5 27.5 L79.5 20.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
