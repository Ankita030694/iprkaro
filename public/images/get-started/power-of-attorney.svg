<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <filter id="shadow-doc" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Document Sheet -->
  <g filter="url(#shadow-doc)">
    <rect x="22" y="14" width="56" height="72" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    
    <!-- Top folded corner illusion or header bar -->
    <path d="M64 14 L78 28 L64 28 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M64 14 L64 28 L78 28" stroke="#CBD5E1" stroke-width="2" />

    <!-- Legal Scales of Justice Emblem -->
    <g transform="translate(50, 42)">
      <!-- Central Pillar / Stand -->
      <path d="M-1 -16 L1 -16 L1 12 L-1 12 Z" fill="#D97706" />
      <circle cx="0" cy="-16" r="3" fill="#D97706" />
      <!-- Base -->
      <path d="M-8 12 L8 12 L6 15 L-6 15 Z" fill="#D97706" />

      <!-- Balance Beam -->
      <path d="M-15 -10 L15 -10" stroke="#D97706" stroke-width="2" stroke-linecap="round" />

      <!-- Left Scale Pan -->
      <path d="M-15 -10 L-20 0 L-10 0 Z" fill="none" stroke="#B45309" stroke-width="1.2" />
      <path d="M-22 0 C-22 5 -8 5 -8 0 Z" fill="#F59E0B" stroke="#D97706" stroke-width="1.2" />

      <!-- Right Scale Pan -->
      <path d="M15 -10 L10 0 L20 0 Z" fill="none" stroke="#B45309" stroke-width="1.2" />
      <path d="M8 0 C8 5 22 5 22 0 Z" fill="#F59E0B" stroke="#D97706" stroke-width="1.2" />
    </g>

    <!-- Document Lines -->
    <rect x="30" y="63" width="40" height="3" rx="1.5" fill="#E2E8F0" />
    <rect x="30" y="69" width="22" height="3" rx="1.5" fill="#E2E8F0" />

    <!-- Signature line -->
    <path d="M54 74 C57 71, 60 76, 63 72 C66 69, 69 75, 72 73" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" fill="none" />
  </g>
</svg>
